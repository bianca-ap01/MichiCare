icle class="mini-post"><span class="badge coral">Cuidados · Ejemplo ficticio</span><h2>Su historia, lista para la próxima consulta</h2><p>Notas y preguntas para conversar con tu veterinario.</p></article></div></div></section>`:page==='preguntas'?`<section class="public-section white-section"><div class="wrap"><div class="heading-center"><span class="eyebrow">HABLEMOS CON CLARIDAD</span><h1>Preguntas frecuentes.</h1></div><div class="faq-list">${faq.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></div></section>`:`<section class="hero" id="inicio-publico"><div class="wrap"><div class="hero-grid"><div class="hero-copy"><span class="badge outline">${icon('heart')}SU MUNDO, MEJOR ACOMPAÑADO</span><h1>Su bienestar,<br><em>tu tranquilidad.</em></h1><p>Encuentra veterinarias y organiza el historial y los cuidados de tu gato en un solo lugar.</p><div class="hero-actions">${btn('Comenzar gratis','register','arrow')}${btn('Explorar demo','explore','','secondary')}</div><div class="hero-note">${icon('shield')}Prototipo académico · Sin pagos ni cuentas reales</div></div><div class="hero-art"><div class="hero-photo"><img src="${PHOTO}" alt="Gato naranja descansando, imagen de referencia para Milo" width="1000" height="1000" fetchpriority="high"></div><div class="float-card float-profile">${avatar({name:'Milo',avatar:'orange'})}<div><strong>Milo, tu compañero</strong><small>Su historia, siempre contigo.</small></div>${icon('heart')}</div><div class="float-card float-tasks"><span class="icon-tile">${icon('check')}</span><div><strong>Un cuidado a la vez</strong><small>Consulta y seguimiento conectados</small></div></div><span class="photo-caption">Interfaz conceptual · Datos ficticios</span></div></div></div></section><section class="public-section white-section home-links"><div class="wrap"><div class="heading-center"><h2>Elige qué quieres conocer.</h2></div><div class="grid3">${[['cat','Cómo funciona','Del perfil de tu gato al próximo cuidad /* 4. Vistas del recorrido núcleo: veterinarias, consultas y seguimiento. */
function filterVets(){
 return vets.filter(v=>(!ui.vet.query||norm(v.name).includes(norm(ui.vet.query)))
  &&(!ui.vet.zone||v.zone===ui.vet.zone)
  &&(!ui.vet.service||v.services.includes(ui.vet.service))
  &&(!ui.vet.specialty||v.specialties.includes(ui.vet.specialty))
  &&(!ui.vet.emergency||v.emergency===ui.vet.emergency)
  &&(!ui.vet.mode||v.mode===ui.vet.mode)
  &&(!ui.savedOnly||state.savedVets.includes(v.id)));
}

eptuales y sigue cada aporte y gasto en su libro simulado.</p></div>${btn('Ver donaciones y transparencia','nav-donaciones','leaf','secondary')}</div>`;}
function updatePosts(){document.querySelector('#post-results').innerHTML=postCards();document.querySelector('#post-count').textContent=`${filteredPosts().length} publicaciones`;}
function postForm(id=''){const p=state.posts.find(p=>p.id===id);const key=p?'post-'+id:'post-new';const d=draftValues(key,{title:p?.title||'',category:p?.category||'Convivencia',body:p?.body||''});openModal(p?'Editar hilo local':'Crear un hilo','Esta publicación solo se guardará en tu navegador. No se publicará ni enviará a otras personas.',`<form data-form="post" data-id="${escapeHTML(id)}" data-draft="${key}" novalidate>${formErrorSlot()}<div class="field-grid">${field('title','Título del hilo','text',d.title,{required:true,wide:true})}${field('category','Categoría','select',d.category,{choices:categories,wide:true})}${field('body','Mensaje inicial','textarea',d.body,{required:true,wide:true,maxlength:4000,rows:5,help:'Evita datos personales y recomendaciones de dosis o tratamientos. Esta entrada se identifica como opinión no verificada.'})}</div><div class="form-actions">${btn('Cerrar y guardar borrador','close-modal','','secondary')}<button type="submit" class="btn">Guardar hilo ${icon('check')}</button></div></form>`);}
function renderBenefits(){return `${pageHeading('MÁS FORMAS DE ACOMPAÑAR','Un poquito más, para ellos.','Explora beneficios futuros y prueba el recorrido solidario con transparencia.')}<div class="notice warning" style="margin-bottom:25px">No hay convenios, descuentos ni campañas reales activas. El recorrido solidario permite simular aportes y gastos, sin mover dinero.</div><div class="grid3"><article class="concept-card"><span class="icon-tile">${icon('heart')}</span><h2>Beneficios con aliados</h2><p>Una propuesta futura que requeriría acuerdos y condiciones verificables.</p><span class="badge coral">Próximamente · sin alianzas reales</span></article><article class="concept-card"><span class="icon-tile">${icon('spark')}</span><h2>Promociones responsables</h2><p>Una idea para dar a conocer oportunidades con condiciones claras. No hay descuentos ni consultas gratuitas disponibles.</p><span class="badge coral">Próximamente · propuesta futura</span></article><article class="concept-card"><span class="icon-tile">${icon('leaf')}</span><h2>Donaciones con transparencia</h2><p>Campaña, presupuesto, aporte simulado, constancia y rendición de gastos. Puedes revisar ingresos, gastos y saldo.</p><span class="badge">Flujo de demostración · sin dinero real</span>${btn('Ver campañas y transparencia','nav-donaciones','arrow','secondary full')}</article></div><div class="upgrade-banner"><div><h3>La solidaridad no depende de una membresía.</h3><p>La comunidad y el recorrido de donaciones están disponibles en Básico y Plus. Los convenios comerciales siguen siendo propuestas futuras.</p></div>${btn('Comparar planes','nav-plan','arrow','secondary')}</div>`;}

function renderSettings(){const d=draftValues('tutor',{name:state.user?.name||'',email:state.user?.email||''});return `${pageHeading('TU ESPACIO, A TU MANERA','Ajustes de la demostración.','Todo se guarda únicamente en este navegador. Usa información ficticia.')}<div class="card settings-card"><h2>Tu perfil de demostración</h2><form data-form="tutor" data-draft="tutor" novalidate>${formErrorSlot()}<div class="field-grid">${field('name','Tu nombre','text',d.name,{required:true,maxlength:70})}${field('email','Correo electrónico','email',d.email,{required:true})}</div><div class="form-actions"><button class="btn" type="submit">Guardar perfil ${icon('check')}</button></div></form><div class="settings-line"><div><h3>Datos y privacidad</h3><p>No se envían datos, contraseñas ni formularios a servidores. La persistencia depende de los permisos del navegador y puede variar al abrir archivos locales. Evita datos sensibles.</p></div></div><div class="settings-line"><div><h3>Restablecer demo</h3><p>Elimina los perfiles, consultas, tratamientos, publicaciones locales, guardados, reseñas, respuestas, donaciones simuladas, gastos, borradores y plan de esta demo. No afecta otros archivos ni aplicaciones.</p></div>${btn('Restablecer demo','reset','reset','danger')}</div><div class="settings-line"><div><h3>Volver a presentar la propuesta</h3><p>Puedes volver a la landing conservando todos tus datos.</p></div>${btn('Ver landing','nav-landing','arrow','secondary')}</div></div>`;}

function requireCat(){if(activeCat())return true;toast('Crea o carga un perfil de gato para continuar.');go('gatos');return false;}
function requirePlus(message='Esta herramienta forma parte de Plus.'){if(state.plan==='plus')return true;showUpgrade(message);return false;}
function showUpgrade(message='Básico incluye un gato. Plus permite añadir varios compañeros.'){openModal('Más formas de acompañarlos.',message,`<div class="notice">Básico incluye un gato y mantiene disponible el seguimiento manual. Tus datos siempre se conservan al cambiar de plan.</div><h3>MichiCare Plus · S/20 al mes</h3><p class="small">Varios gatos, recordatorios personalizados, resumen avanzado e impresión del historial. Es una hipótesis comercial en validación.</p><p class="notice warning">Modo demostración: no se realizará ningún cobro. No se solicitará tarjeta bancaria.</p><div class="form-actions">${btn('Ver comparador','nav-plan','','secondary')}${btn('Continuar a Plus','upgrade','arrow')}</div>`);}
function confirmPlus(){openModal('Prueba MichiCare Plus.','S/20 mensuales · hipótesis comercial en validación',`<span class="badge dark">Activación simulada y reversible</span><ul class="plan-list">${['Perfiles de varios gatos','Recordatorios visuales personalizados en la app','Resumen avanzado del seguimiento','Historial para imprimir o guardar como PDF'].map(t=>`<li>${icon('check')}${t}</li>`).join('')}</ul><div class="notice warning">Modo demostración: no se realizará ningún cobro. No se solicita tarjeta ni se contrata una suscripción real. Puedes volver a Básico en Mi plan.</div><div class="form-actions">${btn('Ahora no','close-modal','','secondary')}${btn('Activar demostración','confirm-plus','spark')}</div>`);}
let confirmAction=null;
function confirmDialog(title,body,label,callback){confirmAction=callback;openModal(title,'Revisa esta acción antes de continuar.',`<p class="small">${body}</p><div class="form-actions">${btn('Cancelar','close-modal','','secondary')}${btn(label,'confirm-action','check','danger')}</div>`);}
function addCat(id=''){ensureDemo();const cat=state.cats.find(c=>c.id===id);if(!cat&&state.plan==='basic'&&state.cats.length>=1)return showUpgrade();if(cat&&state.plan==='basic'&&cat.id!==state.cats[0]?.id)return showUpgrade('El perfil adicional está conservado. Reactiva Plus para editarlo o seleccionarlo.');openModal(cat?'Editar perfil':'Añadir gato','Un perfil para su historia. Puedes elegir un avatar y añadir datos aproximados.',catFormMarkup(cat));}
function loadMilo(){ensureDemo();let milo=state.cats.find(c=>norm(c.name)==='milo');if(!milo){if(state.plan==='basic'&&state.cats.length>=1)return showUpgrade('Ya tienes el perfil incluido en Básico. Activa Plus para añadir a Milo sin borrar tu gato.');milo={id:uid(),name:'Milo',avatar:'orange',age:'3',birth:'',sex:'Macho',sterilized:'Sí',breed:'Mestizo',notes:'Perfil ficticio para recorrer el prototipo. No corresponde a un paciente real.'};state.cats.push(milo);}if(state.plan==='basic'&&state.cats[0]?.id!==milo.id)return showUpgrade('Milo está conservado como perfil adicional. Activa Plus para seleccionarlo.');state.activeCatId=milo.id;advanceGuide('cat',milo);persist();const onboarding=['registro','acceso','onboarding'].includes(route());go(onboarding&&!state.guide.active?'elegir-plan':'inicio');toast('Perfil ficticio de Milo cargado. Las consultas y tareas las registrarás tú.');}
function startGuide(){ensureDemo();state.guide={active:true,step:0,catId:null,vetId:null,consultationId:null,treatmentId:null};persist();go('gatos');toast('Recorrido iniciado. Realiza cada acción; el indicador mostrará tu avance.');}
function guideNext(){const g=state.guide;if(g.step>0&&g.catId&&state.cats.some(c=>c.id===g.catId)){if(state.plan==='basic'&&state.cats[0]?.id!==g.catId)return showUpgrade('Milo es un perfil adicional conservado. Reactiva Plus para continuar.');state.activeCatId=g.catId;persist();}switch(g.step){case 0:return loadMilo();case 1:case 2:return go('veterinarias');case 3:return consultationForm();case 4:return showConsultation(g.consultationId);case 5:return go('seguimiento');case 6:return go('historial');case 7:return go('plan');case 8:return go('inicio');default:return go('inicio');}}
function requestForm(vetId){const v=vets.find(v=>v.id===vetId);if(!v)return;const key='request-'+vetId;const d=draftValues(key,{name:state.user?.name||'',message:''});openModal('Solicitar información',`${v.name} · Clínica ficticia`, `<form data-form="request" data-id="${vetId}" data-draft="${key}" novalidate>${formErrorSlot()}<div class="notice">Solicitud local y simulada. No hay destinatario real y no se envían mensajes.</div><div class="stack">${field('name','Nombre de demostración','text',d.name,{required:true,maxlength:70})}${field('message','Mensaje de demostración','textarea',d.message,{required:true,maxlength:1500,help:'Usa solo datos ficticios; no incluyas información médica sensible.'})}</div><div class="form-actions">${btn('Cerrar y guardar borrador','close-modal','','secondary')}<button type="submit" class="btn">Simular solicitud ${icon('arrow')}</button></div></form>`);}
function observationForm(id){const t=state.treatments.find(t=>t.id===id);if(!t)return;const key='observation-'+id;const d=draftValues(key,{date:today(),text:''});openModal('Una nota sobre su evolución',escapeHTML(t.name),`<form data-form="observation" data-id="${id}" data-draft="${key}" novalidate>${formErrorSlot()}<div class="stack">${field('date','Fecha de la observación','date',d.date,{required:true})}${field('text','Observación de evolución','textarea',d.text,{required:true,maxlength:2000,help:'Registra lo que observas. Las dudas clínicas deben revisarse con tu veterinario.'})}</div><div class="form-actions">${btn('Cerrar y guardar borrador','close-modal','','secondary')}<button class="btn" type="submit">Guardar observación ${icon('check')}</button></div></form>`);}
function reminderForm(id='',treatmentId=''){if(!requirePlus('Los recordatorios personalizados forman parte de Plus. El seguimiento manual sigue disponible en Básico.'))return;if(!requireCat())return;const r=state.reminders.find(r=>r.id===id);const t=state.treatments.find(t=>t.id===treatmentId);const key=r?'reminder-'+id:'reminder-new-'+state.activeCatId;const d=draftValues(key,{title:r?.title||t?.name||'',date:r?.due.slice(0,10)||today(),time:r?.due.slice(11,16)||'09:00',note:r?.note||''});openModal(r?'Editar recordatorio':'Crear recordatorio personalizado','Solo será visible dentro de la app; no hay alarmas ni notificaciones externas.',`<form data-form="reminder" data-id="${escapeHTML(id)}" data-cat="${state.activeCatId}" data-treatment="${escapeHTML(t?.id||r?.treatmentId||'')}" data-draft="${key}" novalidate>${formErrorSlot()}<div class="field-grid">${field('title','Qué quieres recordar','text',d.title,{required:true,wide:true})}${field('date','Fecha del recordatorio','date',d.date,{required:true})}${field('time','Hora del recordatorio','time',d.time,{required:true})}${field('note','Nota personalizada (opcional)','textarea',d.note,{wide:true,maxlength:1500})}</div><div class="form-actions">${btn('Cerrar y guardar borrador','close-modal','','secondary')}<button class="btn" type="submit">Guardar recordatorio ${icon('check')}</button></div></form>`);}
function scheduleFrom(data,existing){if(!validDate(data.start)||!validDate(data.end))throw Error('Revisa las fechas de inicio y fin.');const days=Math.round((new Date(data.end+'T12:00:00')-new Date(data.start+'T12:00:00'))/86400000)+1;if(days<1)throw Error('La fecha de fin debe ser igual o posterior al inicio.');if(days>60)throw Error('Divide este seguimiento en periodos de hasta 60 días.');const times=[...new Set(data.times.split(',').map(t=>t.trim()))].sort();if(!times.length||times.length>6||times.some(t=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(t)))throw Error('Escribe entre 1 y 6 horarios válidos en formato HH:MM, separados por comas.');if(days*times.length>180)throw Error('Este seguimiento supera 180 tareas. Reduce el periodo o los horarios.');const tasks=[];for(let day=0;day<days;day++){for(const time of times){const due=shiftDate(data.start,day)+'T'+time;const previous=existing?.tasks.find(task=>task.due===due);tasks.push(previous?{...previous}:{id:uid(),due,status:'Pendiente'});}}if(existing?.tasks.some(task=>task.status!=='Pendiente'&&!tasks.some(next=>next.id===task.id)))throw Error('El nuevo calendario quitaría tareas ya marcadas. Mantén esos horarios y fechas, o vuelve esas tareas a Pendiente antes de cambiarlos.');return tasks;}
function exportHistory(){if(!requirePlus('La impresión del historial y los resúmenes forma parte de Plus. Puedes consultar todo tu historial en Básico.'))return;if(!requireCat())return;const cat=activeCat(),consults=catConsultations(),treatments=catTreatments();document.querySelector('#print-area').innerHTML=`<h1>MichiCare · Historial de ${escapeHTML(cat.name)}</h1><p>Prototipo académico · Datos ingresados localmente · ${dateLabel(today())}<br>Este documento organiza información del tutor y no constituye un diagnóstico ni una receta.</p><h2>Perfil</h2><p>Edad aproximada: ${escapeHTML(cat.age||'No indicada')} · Sexo: ${escapeHTML(cat.sex)} · Esterilización: ${escapeHTML(cat.sterilized)}<br>Observaciones: ${escapeHTML(cat.notes||'Sin observaciones')}</p><h2>Consultas</h2>${consults.length?consults.map(c=>`<article><h3>${escapeHTML(c.reason)} · ${dateLabel(c.date)}</h3><p>Clínica: ${escapeHTML(c.clinic)}<br>Diagnóstico informado: ${escapeHTML(c.diagnosis||'No registrado')}<br>Indicaciones: ${escapeHTML(c.indications)}<br>Medicamentos prescritos: ${escapeHTML(c.medications||'No registrados')}<br>Próximo control: ${c.next?dateLabel(c.next):'Sin fecha'}<br>Adjunto simulado: ${escapeHTML(c.attachment||'Sin referencia')}<br>Notas: ${escapeHTML(c.notes||'Sin notas')}</p></article>`).join(''):'<p>No hay consultas registradas.</p>'}<h2>Seguimientos y evolución</h2>${treatments.length?treatments.map(t=>`<article><h3>${escapeHTML(t.name)}</h3><p>${escapeHTML(t.instructions)}<br>Frecuencia ingresada: ${escapeHTML(t.frequency)}<br>Progreso: ${progress(t).done} de ${progress(t).total} completadas; ${progress(t).omitted} omitidas.</p><table><thead><tr><th>Fecha y hora</th><th>Estado</th></tr></thead><tbody>${t.tasks.map(task=>`<tr><td>${dateLabel(task.due)} · ${task.due.slice(11,16)}</td><td>${task.status}</td></tr>`).join('')}</tbody></table>${t.observations.map(o=>`<p>${dateLabel(o.date)}: ${escapeHTML(o.text)}</p>`).join('')}</article>`).join(''):'<p>No hay seguimientos registrados.</p>'}`;toast('Se abrirá la impresión. Elige Guardar como PDF si tu navegador lo permite.');window.print();}
/* 6A. Reseñas ligadas a visitas declaradas por el tutor. No son verificaciones clínicas. */
function clinicIdFor(consultation){return vets.find(v=>norm(v.name)===norm(consultation?.clinic||''))?.id||null;}
function vetReviews(id){return [...sampleReviews.filter(r=>r.vetId===id),...state.reviews.filter(r=>r.vetId===id).map(r=>{const visit=state.consultations.find(c=>c.id===r.consultationId);const cat=state.cats.find(c=>c.id===r.catId);return {...r,example:false,catName:cat?.name||'Gato',avatar:cat?.avatar||'orange',visitDate:visit?.date};})];}
function ratingMarkup(id){const reviews=vetReviews(id),average=reviews.reduce((n,r)=>n+r.score,0)/(reviews.length||1);return `<div class="rating-summary">${icon('star')}<strong>${average.toFixed(1)}/5</strong><span>${reviews.filter(r=>r.example).length} de ejemplo · ${reviews.filter(r=>!r.example).length} locales</span><small>Puntaje ilustrativo, no verificado</small></div>`;}
function renderVetReviews(v){const reviews=vetReviews(v.id);return `<section class="clinic-reviews" aria-labelledby="reviews-title"><div class="card-header"><div><span class="eyebrow">EXPERIENCIAS POR SERVICIO</span><h2 id="reviews-title">Puntuaciones y visitas</h2></div>${btn('Escribir reseña','write-review','star','secondary',v.id)}</div><p class="small">Las reseñas de ejemplo son ficticias. Las reseñas locales se vinculan a una consulta registrada por el tutor; no acreditan que la clínica haya verificado la visita ni su calidad.</p>${ratingMarkup(v.id)}<div class="service-scores">${v.services.map(service=>{const group=reviews.filter(r=>r.service===service);return `<div><span>${service}</span><strong>${group.length?(group.reduce((n,r)=>n+r.score,0)/group.length).toFixed(1)+'/5 · '+group.length+' reseña(s)':'Sin reseñas'}</strong></div>`;}).join('')}</div><h3>Gatos que visitaron este centro</h3><p class="tiny muted">Solo nombres y avatares compartidos en reseñas. No se muestra el historial médico.</p><div class="visit-chips">${reviews.filter(r=>r.shareCat).map(r=>`<div class="visit-chip">${avatar({name:r.catName,avatar:r.avatar})}<div><strong>${escapeHTML(r.catName)} fue aquí</strong><span>${dateLabel(r.visitDate,true)} · ${r.example?'Ejemplo ficticio':'Declarado por su tutor'}</span></div></div>`).join('')||'<p class="small">Todavía no se han compartido visitas.</p>'}</div><div class="stack">${reviews.map(r=>`<article class="review-card ${r.example?'':'local-review'}"><div class="row between flex-wrap"><span class="badge ${r.example?'':'coral'}">${r.example?'Reseña ficticia de ejemplo':'Reseña local · sin verificar'}</span><span class="review-stars">${icon('star')} ${r.score} de 5</span></div><h3>${escapeHTML(r.service)}</h3><p>${escapeHTML(r.body)}</p><div class="review-author">${escapeHTML(r.author)} · ${dateLabel(r.date,true)}<br>${r.shareCat?escapeHTML(r.catName):'Nombre del gato no compartido'} · Visita ${dateLabel(r.visitDate,true)}</div>${!r.example?`<div class="row flex-wrap">${btn('Editar reseña','edit-review','edit','link',r.id)}${btn('Eliminar reseña','delete-review','trash','link',r.id)}</div>`:''}</article>`).join('')}</div></section>`;}
function reviewForm(vetId,id=''){const v=vets.find(v=>v.id===vetId);if(!v)return;const old=state.reviews.find(r=>r.id===id);const eligible=state.consultations.filter(c=>clinicIdFor(c)===vetId&&c.date<=today()&&(!state.reviews.some(r=>r.consultationId===c.id&&r.id!==id)));

  advanceGuide('consultation',c);finishForm(form,'Consulta guardada. Puedes crear su seguimiento desde Ver detalle.','historial');
 } else if(type==='treatment'){
  const catId=form.dataset.cat;if(!state.cats.some(c=>c.id===catId))return formError(form,'El perfil del gato ya no está disponible.');
  const old=state.treatments.find(t=>t.id===form.dataset.id);let tasks;try{tasks=scheduleFrom(data,old);}catch(error){return formError(form,error.message,'times');}
  const consultationId=state.consultations.some(c=>c.id===form.dataset.consultation&&c.catId===catId)?form.dataset.consultation:null;
  const t={...data,id:old?.id||uid(),catId,consultationId,tasks,observations:old?.observations||[]};if(old)state.treatments=state.treatments.map(item=>item.id===old.id?t:item);else state.treatments.push(t);
  advanceGuide('treatment',t);finishForm(form,'Seguimiento guardado. Las tareas ya están listas para marcarse manualmente.','seguimiento');
 } else if(type==='observation'){
  const t=state.treatments.find(t=>t.id===form.dataset.id);if(!t)return formError(form,'El seguimiento ya no está disponible.');t.observations.push({id:uid(),date:data.date,text:data.text});finishForm(form,'Observación de evolución guardada.','seguimiento');
 } else if(type==='request'){
  const v=vets.find(v=>v.id===form.dataset.id);if(!v)return formError(form,'La clínica ya no está disponible.');state.requests.push({id:uid(),vetId:v.id,name:data.name,message:data.message,date:today()});advanceGuide('request',{id:v.id});finishForm(form,'Solicitud simulada guardada. No se envió ningún mensaje.','clinica/'+v.id);
 } else if(type==='post'){
  if(!categories.includes(data.category))return formError(form,'Elige una categoría válida.','category');const old=state.posts.find(p=>p.id===form.dataset.id);const post={...data,id:old?.id||uid(),author:state.user?.name||'Tutor de demostración',source:'opinion',example:false,date:old?.date||today()};if(old)state.posts=state.posts.map(p=>p.id===old.id?post:p);else state.posts.unshift(post);ui.community={query:'',category:'',source:''};finishForm(form,'Entrada guardada localmente. No se publicó en internet.','comunidad');
 } else if(type==='reminder'){
  if(state.plan!=='plus')return formError(form,'Activa Plus de demostración para personalizar recordatorios.');if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(data.time))return formError(form,'Revisa la hora del recordatorio.','time');const old=state.reminders.find(r=>r.id===form.dataset.id);const reminder={id:old?.id||uid(),catId:form.dataset.cat,treatmentId:form.dataset.treatment||null,title:data.title,due:data.date+'T'+data.time,note:data.note,done:old?.done||false};if(old)state.reminders=state.reminders.map(r=>r.id===old.id?reminder:r);else state.reminders.push(reminder);finishForm(form,'Recordatorio guardado. Será visible al abrir la app.','seguimiento');
 } else if(type==='tutor'){state.user={name:data.name,email:data.email};finishForm(form,'Perfil de demostración actualizado.','ajustes');}
});
function recordInput(event){const form=event.target.closest('form[data-draft]');if(form&&event.target.name!=='password'){saveDraft(form.dataset.draft,form);if(modal.contains(form))modalDirty=true;const alert=form.querySelector('.form-error');if(alert)alert.hidden=true;event.target.removeAttribute('aria-invalid');}const vetFields={'vet-query':'query','vet-zone':'zone','vet-service':'service','vet-specialty':'specialty','vet-emergency':'emergency','vet-mode':'mode'};if(vetFields[event.target.id]){ui.vet[vetFields[event.target.id]]=event.target.value;updateDirectory();}const postFields={'post-query':'query','post-category':'category','post-source':'source'};if(postFields[event.target.id]){ui.community[postFields[event.target.id]]=event.target.value;updatePosts();}}
document.addEventListener('input',recordInput);
document.addEventListener('change',event=>{
 if(event.target.matches('select')&&!event.target.matches('[data-task],#active-cat'))recordInput(event);
 if(event.target.id==='active-cat'){const id=event.target.value;const cat=state.cats.find(c=>c.id===id);if(!cat)return;if(state.plan==='basic'&&state.cats[0]?.id!==id){event.target.value=state.activeCatId;return showUpgrade();}state.activeCatId=id;persist();render();toast('Ahora estás viendo los cuidados de '+cat.name+'.');}
 if(event.target.matches('[data-task]')){const id=event.target.dataset.task;const t=state.treatments.find(t=>t.id===event.target.dataset.treatment);const task=t?.tasks.find(task=>task.id===id);if(!task||!['Pendiente','Completada','Omitida'].includes(event.target.value))return;task.status=event.target.value;advanceGuide('task',{treatmentId:t.id,status:task.status});persist();render();const next=[...document.querySelectorAll('[data-task]')].find(el=>el.dataset.task===id);next?.focus({preventScroll:true});toast('Tarea marcada como '+task.status.toLocaleLowerCase('es')+'.');}
});
function toggleSavedVet(id){if(!vets.some(v=>v.id===id))return;const saved=state.savedVets.includes(id);state.savedVets=saved?state.savedVets.filter(v=>v!==id):[...state.savedVets,id];if(!saved)advanceGuide('save-vet',{id});persist();render();toast(saved?'Clínica retirada de guardadas.':'Clínica guardada en esta demostración.');}
function selectCat(id){const cat=state.cats.find(c=>c.id===id);if(!cat)return;if(state.plan==='basic'&&state.cats[0]?.id!==id)return showUpgrade('El perfil adicional está conservado. Reactiva Plus para seleccionarlo.');state.activeCatId=id;persist();render();toast(cat.name+' es ahora tu gato activo.');}
function deleteConsultation(id){const c=state.consultations.find(c=>c.id===id);if(!c)return;confirmDialog('¿Eliminar esta consulta?',`Se eliminará «${escapeHTML(c.reason)}». Los seguimientos relacionados se conservarán como registros manuales, sin vínculo a la consulta. Las reseñas ligadas a esta visita se eliminarán.`, 'Eliminar consulta',()=>{state.consultations=state.consultations.filter(c=>c.id!==id);state.reviews=state.reviews.filter(r=>r.consultationId!==id);state.treatments.forEach(t=>{if(t.consultationId===id)t.consultationId=null;});delete state.drafts['consultation-'+id];if(state.guide.consultationId===id&&state.guide.step<9){state.guide.step=3;state.guide.consultationId=null;state.guide.treatmentId=null;}persist();go('historial');toast('Consulta eliminada. Los seguimientos se conservaron.');});}
function resetDemo(){confirmDialog('¿Restablecer esta demostración?','Se eliminarán los datos y borradores de este prototipo guardados en el navegador. Volverás al plan Básico y a la landing. Esta acción no modifica index.html ni prototipo.html.','Sí, restablecer demo',()=>{pendingDonation=null;state=freshState();ui={vet:{query:'',zone:'',service:'',specialty:'',emergency:'',mode:''},community:{query:'',category:'',source:''},schedule:'list',savedOnly:false};storageWarning='';try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(STORAGE_KEY+'-backup');}catch{storageWarning='No se pudo borrar el almacenamiento del navegador. Los cambios de esta sesión se restablecieron.';}go('landing');toast('Demo restablecida. Puedes comenzar un nuevo recorrido.');});}
function sampleConsultation(){const form=modal.querySelector('[data-form="consultation"]');if(!form)return;const example={date:today(),clinic:state.guide.vetId?vets.find(v=>v.id===state.guide.vetId)?.name||vets[0].name:vets[0].name,reason:'Consulta de demostración',diagnosis:'Dato ficticio de ejemplo. No representa un diagnóstico real.',indications:'Registrar una observación del cuidado y revisar las anotaciones según las indicaciones del profesional. Ejemplo simulado, no constituye una recomendación clínica.',medications:'No se registran medicamentos en este ejemplo ficticio.',next:shiftDate(today(),7),notes:'Registro ficticio para probar la continuidad entre consulta y seguimiento.',attachment:'nota-ficticia.pdf'};for(const [name,value]of Object.entries(example))form.elements.namedItem(name).value=value;saveDraft(form.dataset.draft,form);modalDirty=true;toast('Ejemplo ficticio cargado. Revísalo y guarda la consulta.');}
document.addEventListener('click',event=>{
 const skip=event.target.closest('.skip');if(skip){event.preventDefault();const main=document.querySelector('#main-content');main?.focus();main?.scrollIntoView();return;}
 const link=event.target.closest('a[href^="#/"]');if(link&&modal.contains(link))closeModal();
 const feature=event.target.closest('[data-feature]');if(feature){ensureDemo();go(feature.dataset.feature);return;}
 const publicLink=event.target.closest('#public-nav a');if(publicLink){document.querySelector('#public-nav')?.classList.remove('open');const toggle=document.querySelector('[data-action="public-menu"]');toggle?.setAttribute('aria-expanded','false');toggle?.setAttribute('aria-label','Abrir menú');return;}
 const control=event.target.closest('[data-action]');if(!control)return;const action=control.dataset.action,id=control.dataset.id;
 if(action.startsWith('nav-')){go(action.slice(4));return;}
 switch(action){
 case 'hide-toast':document.querySelector('#toast').hidden=true;break;
 case 'close-modal':closeModal();break;
 case 'register':go('registro');break;
 case 'login':go('acceso');break;
 case 'continue-demo':ensureDemo();go(state.cats.length?'inicio':'onboarding');break;
 case 'explore':ensureDemo();if(!state.cats.length)loadMilo();else go('inicio');break;
 case 'open-community':ensureDemo();go('comunidad');break;
 case 'public-menu':{const nav=document.querySelector('#public-nav');const open=!nav.classList.contains('open');nav.classList.toggle('open',open);control.setAttribute('aria-expanded',String(open));control.setAttribute('aria-label',open?'Cerrar menú':'Abrir menú');break;}
 case 'mobile-menu':openModal('Tu espacio MichiCare','Elige qué quieres explorar.',`${navMarkup(true)}<div class="divider"></div>${btn('Probar recorrido de Milo','start-guide','spark','secondary full')}${btn('Restablecer demo','reset','reset','link full')}`);break;
 case 'add-cat':addCat();break;
 case 'edit-cat':addCat(id);break;
 case 'show-cat':go('gato/'+id);break;
 case 'select-cat':selectCat(id);break;
 case 'load-milo':loadMilo();break;
 case 'start-guide':startGuide();break;
 case 'guide-next':guideNext();break;
 case 'end-guide':state.guide.active=false;persist();refreshGuide();toast('Recorrido pausado. Tus datos y cuidados se conservan.');break;
 case 'view-vet':go('clinica/'+id);break;
 case 'save-vet':toggleSavedVet(id);break;
 case 'request-info':requestForm(id);break;
 case 'saved-vets':ui.savedOnly=!ui.savedOnly;render();break;
 case 'clear-vets':ui.vet={query:'',zone:'',service:'',specialty:'',emergency:'',mode:''};ui.savedOnly=false;render();break;
 case 'add-consultation':consultationForm();break;
 case 'add-consultation-for-vet':consultationForm('',id);break;
 case 'edit-consultation':consultationForm(id);break;
 case 'view-consultation':showConsultation(id);break;
 case 'delete-consultation':deleteConsultation(id);break;
 case 'sample-consultation':sampleConsultation();break;
 case 'treatment-from-consultation':treatmentForm('',id);break;
 case 'add-treatment':treatmentForm();break;
 case 'edit-treatment':treatmentForm(id);break;
 case 'sample-frequency':{const form=modal.querySelector('[data-form="treatment"]');if(form){form.elements.frequency.value='Una anotación diaria, según instrucción ficticia de este ejemplo.';saveDraft(form.dataset.draft,form);modalDirty=true;toast('Frecuencia ficticia cargada. No corresponde a una indicación clínica real.');}break;}
 case 'schedule-list':ui.schedule='list';render();break;
 case 'schedule-calendar':ui.schedule='calendar';render();break;
 case 'add-observation':observationForm(id);break;
 case 'add-reminder':reminderForm();break;
 case 'reminder-for-treatment':reminderForm('',id);break;
 case 'edit-reminder':reminderForm(id);break;
 case 'toggle-reminder':{const r=state.reminders.find(r=>r.id===id);if(r&&state.plan==='plus'){r.done=!r.done;persist();render();toast(r.done?'Recordatorio completado.':'Recordatorio pendiente.');}break;}
 case 'export-history':exportHistory();break;
 case 'write-review':reviewForm(id);break;
 case 'edit-review':{const review=state.reviews.find(r=>r.id===id);if(review)reviewForm(review.vetId,id);break;}
 case 'delete-review':{const review=state.reviews.find(r=>r.id===id);if(review)confirmDialog('¿Eliminar esta reseña local?','La visita seguirá en tu historial. Se retirarán la puntuación y el nombre compartido de la sección de reseñas.','Eliminar reseña',()=>{state.reviews=state.reviews.filter(r=>r.id!==id);delete state.drafts['review-'+id];persist();render();toast('Reseña eliminada. La consulta se conservó.');});break;}
 case 'open-thread':go('hilo/'+id);break;
 case 'reply-thread':replyForm(id);break;
 case 'reply-message':{const reply=[...state.replies,...sampleReplies].find(r=>r.id===id);if(reply)replyForm(reply.threadId,reply.id);break;}
 case 'edit-reply':{const reply=state.replies.find(r=>r.id===id);if(reply)replyForm(reply.threadId,reply.parentId,id);break;}
 case 'delete-reply':{const reply=state.replies.find(r=>r.id===id);if(reply)confirmDialog('¿Eliminar esta respuesta?','Se quitará tu mensaje. Las respuestas posteriores se conservarán como respuestas al hilo.','Eliminar respuesta',()=>{state.replies=state.replies.filter(r=>r.id!==id).map(r=>r.parentId===id?{...r,parentId:null}:r);delete state.drafts['reply-'+id];persist();render();toast('Respuesta eliminada. Se conservaron los otros mensajes.');});break;}
 case 'open-donations':ensureDemo();go('donaciones');break;
 case 'open-campaign':go('campana/'+id);break;
 case 'donate':donationForm(id);break;
 case 'confirm-donation':{if(!pendingDonation)break;const donation=pendingDonation;pendingDonation=null;if(state.donations.some(d=>d.id===donation.id))break;state.donations.push(donation);delete state.drafts['donation-'+donation.campaignId];const saved=persist();modalDraft='';modalDirty=false;render();donationReceipt(donation.id);toast(saved?'Aporte simulado registrado. No se realizó ningún cobro.':'Aporte simulado solo en esta sesión: no se pudo guardar.');break;}
 case 'receipt':donationReceipt(id);break;
 case 'expense':expenseForm(id);break;
 case 'expense-proof':expenseProof(id);break;
 case 'add-post':postForm();break;
 case 'edit-post':postForm(id);break;
 case 'delete-post':{const p=state.posts.find(p=>p.id===id);if(p)confirmDialog('¿Eliminar este hilo local?',`Se eliminará «${escapeHTML(p.title)}» y sus respuestas locales de este navegador.`,'Eliminar hilo',()=>{state.posts=state.posts.filter(p=>p.id!==id);state.replies=state.replies.filter(r=>r.threadId!==id);state.savedPosts=state.savedPosts.filter(p=>p!==id);delete state.drafts['post-'+id];persist();render();toast('Entrada local eliminada.');});break;}
 case 'save-post':{const saved=state.savedPosts.includes(id);state.savedPosts=saved?state.savedPosts.filter(p=>p!==id):[...state.savedPosts,id];persist();if(route()==='comunidad')updatePosts();else render();toast(saved?'Publicación retirada de guardadas.':'Publicación guardada localmente.');break;}
 case 'clear-posts':ui.community={query:'',category:'',source:''};render();break;
 case 'upgrade':confirmPlus();break;
 case 'confirm-plus':{state.plan='plus';advanceGuide('plus');persist();closeModal(true);if(!state.user)go('registro');else if(!state.cats.length)go('onboarding');else if(route()==='elegir-plan')go('inicio');else render();toast('Plus de demostración activado. No se realizó ningún cobro.');break;}
 case 'choose-basic':{if(state.plan==='plus'&&state.user&&state.cats.length&&route()!=='elegir-plan'){confirmDialog('¿Volver a Básico?','Tus datos adicionales se conservarán. Básico permite seleccionar el primer gato.','Confirmar cambio a Básico',()=>{state.plan='basic';state.activeCatId=state.cats[0]?.id||null;persist();go('inicio');toast('Básico activo. Sin cobros ni pérdida de datos.');});break;}state.plan='basic';state.activeCatId=state.cats[0]?.id||null;persist();go(!state.user?'registro':!state.cats.length?'onboarding':'inicio');break;}
 case 'downgrade':confirmDialog('Vuelve a tu ritmo.','Básico incluye 1 gato. Se conservarán todos los perfiles, consultas, seguimientos y recordatorios adicionales. Solo el primer gato podrá seleccionarse hasta que reactives Plus. No hay cobros ni cancelaciones bancarias.','Confirmar cambio a Básico',()=>{state.plan='basic';state.activeCatId=state.cats[0]?.id||null;persist();render();toast('Volviste a Básico. Todos los datos se conservaron.');});break;
 case 'confirm-action':{const run=confirmAction;confirmAction=null;closeModal(true);if(run)run();break;}
 case 'reset':resetDemo();break;
 }
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!modal.open){const nav=document.querySelector('#public-nav.open');if(nav){nav.classList.remove('open');const toggle=document.querySelector('[data-action="public-menu"]');toggle?.setAttribute('aria-expanded','false');toggle?.setAttribute('aria-label','Abrir menú');toggle?.focus();}}});
/* 8. Renderizado y navegación hash; funciona con file:// sin servidor. */
function render(){
 const path=route();document.title='MichiCare · '+(({ 'como-funciona':'Cómo funciona',planes:'Planes',preguntas:'Preguntas frecuentes','comunidad-publica':'Comunidad' })[path]||navItems.find(n=>n[0]===sectionRoute())?.[1]||'Su bienestar, tu tranquilidad');
 if(['landing','como-funciona','planes','preguntas','comunidad-publica'].includes(path))renderLanding(path);
 else if(path==='registro'||path==='acceso')renderAuth(path==='acceso');
 else if(path==='onboarding'){ensureDemo();renderOnboarding();}
 else if(path==='elegir-plan'){ensureDemo();renderChoosePlan();}
 else {
  ensureDemo();if(path==='inicio')advanceGuide('dashboard');if(path==='historial')advanceGuide('history');
  let content;
  if(path==='inicio')content=renderDashboard();
  else if(path==='gatos')content=renderCats();
  else if(path.startsWith('gato/'))content=renderCatDetail(path.slice(5));
  else if(path==='veterinarias')content=renderDirectory();
  else if(path.startsWith('clinica/'))content=renderVetDetail(path.slice(8));
  else if(path==='historial')content=renderHistory();
  else if(path==='seguimiento')content=renderTreatments();
  else if(path==='comunidad')content=renderCommunity();
  else if(path.startsWith('hilo/'))content=renderThread(path.slice(5));
  else if(path==='donaciones')content=renderDonations();
  else if(path.startsWith('campana/'))content=renderCampaign(path.slice(8));
  else if(path==='beneficios')content=renderBenefits();
  else if(path==='plan')content=renderPlan();
  else if(path==='ajustes')content=renderSettings();
  else content=empty('Este espacio no está disponible','Vuelve al inicio para seguir explorando MichiCare.','Ir al dashboard','nav-inicio','home');
  renderShell(content);
 }
}
window.addEventListener('hashchange',()=>{if(modal.open)closeModal();render();window.scrollTo(0,0);document.querySelector('#main-content h1')?.focus({preventScroll:true});});
render();
